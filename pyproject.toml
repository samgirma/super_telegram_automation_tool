[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "super-telegram-automation-tool"
version = "1.0.0"
description = "Read Telegram group members into clean CSVs and invite a chosen set into a group you own."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "samgirma" }]
keywords = [
    "telegram",
    "telethon",
    "scraper",
    "member-management",
    "automation",
    "cli",
    "console-app",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.34.0,<2",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/samgirma/super_telegram_automation_tool"
Repository = "https://github.com/samgirma/super_telegram_automation_tool"
Issues = "https://github.com/samgirma/super_telegram_automation_tool/issues"

[project.scripts]
sta = "tg_app.__main__:main"
tg-scraper = "tg_scraper.__main__:main"
tg-adder = "tg_adder.__main__:main"
tg-filter = "tg_filter.__main__:main"

[tool.setuptools]
packages = ["tg_app", "tg_scraper", "tg_adder", "tg_common", "tg_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true
